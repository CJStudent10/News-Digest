# News sources. Every feed here is free to read (no hard paywall).
#
# lean: left | lean-left | center | lean-right | right
#   Ratings are approximate, based on the public AllSides and Ad Fontes media
#   bias charts. They're here to keep the digest balanced. Check them and
#   change them if you disagree; the balance logic uses whatever you put here.
#
# category: general | world | politics | business | tech | science | local
# enabled:  set to false to switch a source off without deleting it.

sources:
  # ---------- Left / Lean-left ----------
  - id: npr
    name: NPR
    url: https://feeds.npr.org/1001/rss.xml
    lean: lean-left
    category: general
  - id: guardian-us
    name: The Guardian (US)
    url: https://www.theguardian.com/us-news/rss
    lean: lean-left
    category: politics
  - id: guardian-world
    name: The Guardian (World)
    url: https://www.theguardian.com/world/rss
    lean: lean-left
    category: world
  - id: pbs
    name: PBS NewsHour
    url: https://www.pbs.org/newshour/feeds/rss/headlines
    lean: lean-left
    category: general
  - id: vox
    name: Vox
    url: https://www.vox.com/rss/index.xml
    lean: left
    category: politics
  - id: aljazeera
    name: Al Jazeera English
    url: https://www.aljazeera.com/xml/rss/all.xml
    lean: lean-left
    category: world

  # ---------- Center ----------
  - id: bbc-world
    name: BBC News (World)
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    lean: center
    category: world
