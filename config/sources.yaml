# News sources. Every feed here is free to read (no hard paywall).
#
# lean: left | lean-left | center | lean-right | right
#   Ratings are approximate, based on the public AllSides and Ad Fontes media
#   bias charts. They're here to keep the digest balanced. Check them and
#   change them if you disagree; the balance logic uses whatever you put here.
#
# category: general | world | politics | business | tech | science
# enabled:  set to false to switch a source off without deleting it.

sources:
  # ---------- Left / Lean-left ----------
  - id: npr
    name: NPR
    url: https://feeds.npr.org/1001/rss.xml
    lean: lean-left
    category: general
  - id: guardian-us
    name: The Guardian (US)
    url: https://www.theguardian.com/us-news/rss
    lean: lean-left
    category: politics
  - id: guardian-world
    name: The Guardian (World)
    url: https://www.theguardian.com/world/rss
    lean: lean-left
    category: world
  - id: pbs
    name: PBS NewsHour
    url: https://www.pbs.org/newshour/feeds/rss/headlines
    lean: lean-left
    category: general
  - id: vox
    name: Vox
    url: https://www.vox.com/rss/index.xml
    lean: left
    category: politics
  - id: aljazeera
    name: Al Jazeera English
    url: https://www.aljazeera.com/xml/rss/all.xml
    lean: lean-left
    category: world

  # ---------- Center ----------
  - id: bbc-world
    name: BBC News (World)
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    lean: center
    category: world
  - id: bbc-us
    name: BBC News (US & Canada)
    url: https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml
    lean: center
    category: politics
  - id: thehill
    name: The Hill
    url: https://thehill.com/feed/
    lean: center
    category: politics
  - id: axios
    name: Axios
    url: https://api.axios.com/feed/
    lean: center
    category: general
  - id: newsweek
    name: Newsweek
    url: https://www.newsweek.com/rss
    lean: center
    category: general
  - id: dw
    name: Deutsche Welle
    url: https://rss.dw.com/rdf/rss-en-all
    lean: center
    category: world
  - id: cnbc
    name: CNBC
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    lean: center
    category: business

  # ---------- Right / Lean-right ----------
  - id: foxnews
    name: Fox News
    url: https://moxie.foxnews.com/google-publisher/latest.xml
    lean: right
    category: general
  - id: nypost
    name: New York Post
    url: https://nypost.com/feed/
    lean: lean-right
    category: general
  - id: washexaminer
    name: Washington Examiner
    url: https://www.washingtonexaminer.com/feed/
    lean: lean-right
    category: politics
  - id: washtimes
    name: The Washington Times
    url: https://www.washingtontimes.com/rss/headlines/news/
    lean: lean-right
    category: politics
  - id: reason
    name: Reason
    url: https://reason.com/feed/
    lean: lean-right
    category: politics
  - id: dailycaller
    name: The Daily Caller
    url: https://dailycaller.com/feed/
    lean: right
    category: politics
  - id: foxbusiness
    name: Fox Business
    url: https://www.foxbusiness.com/feeds/latest.xml
    lean: lean-right
    category: business

  # ---------- Topic specialists (non-partisan beats) ----------
  - id: arstechnica
    name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    lean: center
    category: tech
  - id: theverge
    name: The Verge
    url: https://www.theverge.com/rss/index.xml
    lean: lean-left
    category: tech
  - id: sciencedaily
    name: ScienceDaily
    url: https://www.sciencedaily.com/rss/all.xml
    lean: center
    category: science
  - id: nasa
    name: NASA News
    url: https://www.nasa.gov/news-release/feed/
    lean: center
    category: science
