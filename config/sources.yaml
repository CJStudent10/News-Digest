    category: general
  - id: newsweek
    name: Newsweek
    url: https://www.newsweek.com/rss
    lean: center
    category: general
  - id: dw
    name: Deutsche Welle
    url: https://rss.dw.com/rdf/rss-en-all
    lean: center
    category: world
  - id: cnbc
    name: CNBC
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    lean: center
    category: business

  # ---------- Right / Lean-right ----------
  - id: foxnews
    name: Fox News
    url: https://moxie.foxnews.com/google-publisher/latest.xml
