    url: https://www.washingtontimes.com/rss/headlines/news/
    lean: lean-right
    category: politics
  - id: reason
    name: Reason
    url: https://reason.com/feed/
    lean: lean-right
    category: politics
  - id: dailycaller
    name: The Daily Caller
    url: https://dailycaller.com/feed/
    lean: right
    category: politics
  - id: foxbusiness
    name: Fox Business
    url: https://www.foxbusiness.com/feeds/latest.xml
    lean: lean-right
    category: business

