# Actions → "Check feeds" → Run workflow: tests every source in config/sources.yaml.
name: Check feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "13 14 * * 1"   # Mondays, so you hear about broken feeds

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Main digest feeds
        run: python -m digest sources check | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Lighter Brief feeds
        run: python -m digest --profile lighter sources check | tee -a "$GITHUB_STEP_SUMMARY"
